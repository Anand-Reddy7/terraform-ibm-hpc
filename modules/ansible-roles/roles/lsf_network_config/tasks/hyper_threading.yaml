---
- name: Define ego_define_ncpus based on hyperthreading
  set_fact:
    ego_define_ncpus: "{{ 'threads' if hyperthreading else 'cores' }}"

- name: Print the value of ego_define_ncpus
  debug:
    msg: "EGO_DEFINE_NCPUS is set to {{ ego_define_ncpus }}"

- name: Create LSF hyperthreading script for disabling threads if hyperthreading is false
  copy:
    dest: /root/lsf_hyperthreading
    content: |
      #!/bin/sh
      for vcpu in $(cat /sys/devices/system/cpu/cpu*/topology/thread_siblings_list | cut -s -d- -f2 | cut -d- -f2 | uniq); do
          echo "0" > "/sys/devices/system/cpu/cpu"$vcpu"/online"
      done
    mode: '0755'
  when: not hyperthreading

- name: Run the hyperthreading script and add to cron if hyperthreading is false
  shell: /root/lsf_hyperthreading
  when: not hyperthreading

- name: Add script to cron for reboot if hyperthreading is false
  cron:
    name: "Disable Hyperthreading"
    special_time: reboot
    job: "/root/lsf_hyperthreading"
  when: not hyperthreading

- name: Set the EGO_DEFINE_NCPUS in LSF config file
  lineinfile:
    path: "{{ LSF_CONF_FILE }}"
    line: "EGO_DEFINE_NCPUS={{ ego_define_ncpus }}"
    create: yes